[defaults]
# Test-only. Relative paths here resolve against this file, not the CWD.
# The shipped ansible/ansible.cfg hardcodes the installer's runtime
# paths (/run/installer/inventory.yml, /opt/k3s-ansible/roles), which do not
# exist in a checkout.
roles_path            = ../../k3s-ansible/roles
host_key_checking     = False
deprecation_warnings  = False
interpreter_python    = auto_silent
retry_files_enabled   = False
nocows                = True

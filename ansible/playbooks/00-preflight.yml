---
# Fail fast, before anything is copied to the nodes, on the conditions that
# actually break an airgapped k3s install.
- name: Preflight
  hosts: k3s_cluster
  gather_facts: true
  become: true
  strategy: linear
  vars:
    preflight_min_memory_mb: 1700
    preflight_min_free_gb: 12
    preflight_max_clock_skew_seconds: 30
  tasks:
    - name: Supported OS family
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}. This bundle stages offline
          packages for Debian/Ubuntu only.
        success_msg: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Architecture matches the downloaded k3s build
      ansible.builtin.assert:
        that: >-
          (target_arch == 'amd64' and ansible_facts['architecture'] == 'x86_64') or
          (target_arch == 'arm64' and ansible_facts['architecture'] == 'aarch64')
        fail_msg: >-
          {{ inventory_hostname }} is {{ ansible_facts['architecture'] }} but the bundle
          was built for {{ target_arch }}. Rebuild with TARGET_ARCH set accordingly.

    - name: Privilege escalation works
      ansible.builtin.command: id -u
      register: preflight_id
      changed_when: false
      failed_when: preflight_id.stdout | trim != '0'

    - name: Node hostnames are unique across the cluster
      run_once: true
      ansible.builtin.assert:
        that: >-
          (groups['k3s_cluster'] | map('extract', hostvars, ['ansible_facts', 'hostname']) | list | unique | length)
          == (groups['k3s_cluster'] | length)
        fail_msg: >-
          Two or more nodes share a hostname
          ({{ groups['k3s_cluster'] | map('extract', hostvars, ['ansible_facts', 'hostname']) | list | join(', ') }}).
          Kubernetes uses the hostname as the node name - give each machine a distinct one.

    - name: Enough memory
      ansible.builtin.assert:
        that: (ansible_facts['memtotal_mb'] | int) >= (preflight_min_memory_mb | int)
        fail_msg: >-
          {{ inventory_hostname }} has {{ ansible_facts['memtotal_mb'] }} MB RAM.
          k3s plus Harbor needs at least {{ preflight_min_memory_mb }} MB (4 GB recommended).

    # df rather than ansible_facts['mounts'], which is empty or partial on some
    # minimal images and inside containers.
    - name: Measure free space on the filesystem holding /var/lib
      ansible.builtin.command:
        cmd: df -P -k /var/lib
      register: preflight_df
      changed_when: false

    - name: Parse df output
      ansible.builtin.set_fact:
        preflight_free_gb: "{{ (preflight_df.stdout_lines[-1].split()[3] | int / 1048576) | round(1) }}"
        preflight_fs: "{{ preflight_df.stdout_lines[-1].split()[5] }}"

    - name: Enough free disk for images and registry storage
      ansible.builtin.assert:
        that: (preflight_free_gb | float) >= (preflight_min_free_gb | float)
        fail_msg: >-
          {{ inventory_hostname }}:{{ preflight_fs }} has {{ preflight_free_gb }} GB free;
          at least {{ preflight_min_free_gb }} GB is needed for the airgap image
          bundles and Harbor's local-path volumes.

    - name: Warn about active swap
      when: ansible_facts['swaptotal_mb'] | int > 0
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} has {{ ansible_facts['swaptotal_mb'] }} MB of swap
          enabled. k3s runs, but the kubelet accounts memory poorly with swap on.

    - name: Clock skew against the installer host
      vars:
        controller_epoch: "{{ lookup('pipe', 'date +%s') | int }}"
      ansible.builtin.assert:
        that: >-
          (((ansible_facts['date_time']['epoch'] | int) - (controller_epoch | int)) | abs)
          <= (preflight_max_clock_skew_seconds | int)
        fail_msg: >-
          {{ inventory_hostname }} clock is
          {{ (((ansible_facts['date_time']['epoch'] | int) - (controller_epoch | int)) | abs) }}s
          off this host. Embedded etcd and TLS will not tolerate that - fix time sync first.

    # ---------------------------------------------------------------------
    # Virtual IP, when one is configured
    # ---------------------------------------------------------------------
    - name: Check the VIP
      when: vip_address | default('') | length > 0
      block:
        - name: The VIP must not be a node address
          ansible.builtin.assert:
            that: vip_address not in (groups['k3s_cluster'] | list)
            fail_msg: >-
              {{ vip_address }} is one of the cluster node addresses. The VIP has
              to be a free address that can move between them.

        # kube-vip in ARP mode can only answer for an address on the same layer 2
        # segment as the node holding it.
        # Compare networks rather than using ipaddr() as a truth test: that
        # filter returns the address as a *string*, and ansible-core rejects a
        # conditional whose result is not a real boolean.
        - name: The VIP must be on this node's subnet
          ansible.builtin.assert:
            that: >-
              (vip_address ~ '/' ~ ansible_facts['default_ipv4']['netmask'])
              | ansible.utils.ipaddr('network')
              == ansible_facts['default_ipv4']['network']
            fail_msg: >-
              {{ vip_address }} is not inside {{ inventory_hostname }}'s subnet
              ({{ ansible_facts['default_ipv4']['network'] }}/{{ ansible_facts['default_ipv4']['netmask'] }}).
              kube-vip uses ARP, so the VIP must be on the same segment as the nodes.

        # A DaemonSet carries one interface name for every node it runs on.
        - name: All servers must agree on the interface name
          run_once: true
          ansible.builtin.assert:
            that: >-
              (groups['k3s_cluster']
               | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'interface'])
               | list | unique | length) == 1
            fail_msg: >-
              The nodes' default interfaces differ
              ({{ groups['k3s_cluster'] | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'interface']) | list | join(', ') }}).
              kube-vip is deployed as one DaemonSet, so it needs a single name that
              is valid everywhere - pass K3S_VIP_INTERFACE to choose it yourself.

        # Something already answering on the VIP is either a clash or our own
        # cluster from a previous run. Only the second is acceptable.
        - name: Is anything already answering on the VIP?
          run_once: true
          ansible.builtin.command:
            cmd: ping -c1 -W1 {{ vip_address }}
          register: preflight_vip_ping
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Is it our own API server?
          when: preflight_vip_ping.rc == 0
          run_once: true
          ansible.builtin.uri:
            url: "https://{{ vip_address }}:6443/version"
            validate_certs: false
            status_code: [200, 401, 403]
          register: preflight_vip_api
          failed_when: false
          check_mode: false

        - name: Refuse to steal an address that is already in use
          when:
            - preflight_vip_ping.rc == 0
            - preflight_vip_api.status is not defined or preflight_vip_api.status not in [200, 401, 403]
          run_once: true
          ansible.builtin.fail:
            msg: >-
              {{ vip_address }} already answers on the network but is not a
              Kubernetes API server, so it belongs to something else. Pick a free
              address for the VIP.

        - name: Record the interface for the kube-vip manifest
          run_once: true
          delegate_to: localhost
          become: false
          ansible.builtin.copy:
            content: "{{ ansible_facts['default_ipv4']['interface'] }}"
            dest: /run/installer/vip-interface
            mode: "0644"

        - name: VIP report
          run_once: true
          ansible.builtin.debug:
            msg: >-
              VIP {{ vip_address }} is free and on-subnet; kube-vip will bind it to
              {{ ansible_facts['default_ipv4']['interface'] }}
              {{ '(already served by this cluster)' if preflight_vip_ping.rc == 0 else '' }}

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ ansible_facts['hostname'] }} ({{ inventory_hostname }}) -
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          {{ ansible_facts['architecture'] }},
          {{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_cores']) }} vCPU,
          {{ ansible_facts['memtotal_mb'] }} MB RAM,
          {{ preflight_free_gb }} GB free on {{ preflight_fs }}

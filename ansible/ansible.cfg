[defaults]
inventory            = /run/installer/inventory.yml
roles_path           = /opt/k3s-ansible/roles
host_key_checking    = False
deprecation_warnings = False
interpreter_python   = auto_silent
display_skipped_hosts = False
retry_files_enabled  = False
force_handlers       = True
timeout              = 30
nocows               = True
stdout_callback      = default
result_format        = yaml

[ssh_connection]
pipelining = True
ssh_args   = -C -o ControlMaster=auto -o ControlPersist=180s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15
transfer_method = smart
